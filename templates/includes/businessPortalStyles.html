<style>
    :root { --ink:#17243a; --muted:#68758a; --line:#e5eaf1; --blue:#2463eb; --gold:#e8b65a; --background:#f3f6fb; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--background); color:var(--ink); font-family:Inter,"Segoe UI",Arial,sans-serif; }
    a { color:inherit; text-decoration:none; }
    .shell { width:min(1200px,calc(100% - 40px)); margin:0 auto; }
    .hero { position:relative; overflow:hidden; padding:25px 0 92px; color:#fff; background:radial-gradient(ellipse at 82% 0%,#33558b 0,transparent 38%),linear-gradient(125deg,#101b31,#172e50 65%,#1f4268); }
    .hero:after { position:absolute; right:-120px; bottom:-320px; width:560px; height:560px; border:1px solid #ffffff18; border-radius:50%; content:""; box-shadow:0 0 0 48px #ffffff08,0 0 0 96px #ffffff06; pointer-events:none; }
    .topbar,.brand,.portal-nav,.heading,.link-row { display:flex; align-items:center; }
    .topbar { position:relative; z-index:1; justify-content:space-between; gap:18px; }
    .brand { gap:11px; color:#eaf0fa; font-weight:700; }
    .brand-mark { display:grid; width:40px; height:40px; place-items:center; border:1px solid #ffffff42; border-radius:12px; color:var(--gold); font-family:Georgia,serif; font-size:23px; }
    .portal-nav { gap:9px; }
    .portal-nav a { padding:9px 12px; border:1px solid #ffffff35; border-radius:8px; color:#eaf0fa; font-size:12px; transition:background .18s ease; }
    .portal-nav a:hover,.portal-nav a.active { background:#ffffff18; }
    .hero-copy { position:relative; z-index:1; max-width:740px; padding-top:52px; }
    .eyebrow { margin:0 0 11px; color:var(--gold); font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(34px,5vw,50px); letter-spacing:-.045em; line-height:1.1; }
    .hero-copy p:last-child { margin:14px 0 0; color:#cfdaea; font-size:15px; line-height:1.65; }
    main { position:relative; z-index:2; padding:38px 0 55px; }
    .intro { margin-bottom:19px; }
    .intro h2 { margin:0; font-size:21px; letter-spacing:-.025em; }
    .intro p { margin:5px 0 0; color:var(--muted); font-size:13px; }
    .report-groups { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:17px; align-items:start; }
    .report-card { overflow:hidden; border:1px solid var(--line); border-radius:14px; background:#fff; box-shadow:0 5px 18px #14243b07; }
    .card-heading { display:flex; align-items:center; gap:11px; padding:17px 18px; border-bottom:1px solid var(--line); }
    .symbol { display:grid; width:38px; height:38px; flex:0 0 38px; place-items:center; border-radius:11px; background:#edf3ff; color:var(--blue); font-size:17px; }
    .report-card:nth-child(2) .symbol { background:#fff5df; color:#a66c08; }
    .report-card:nth-child(3) .symbol { background:#e8f7f1; color:#15815d; }
    .card-heading h3 { margin:0; font-size:14px; }
    .card-heading p { margin:4px 0 0; color:var(--muted); font-size:11px; }
    .link-list { padding:6px 9px 9px; }
    .link-row { justify-content:space-between; gap:12px; padding:10px; border-radius:8px; color:#35445b; font-size:12px; line-height:1.4; }
    .link-row:hover { background:#f4f7fc; color:var(--blue); }
    .link-row span:last-child { color:#9aa5b5; font-size:17px; }
    footer { padding:17px 0 22px; border-top:1px solid var(--line); color:#8490a1; text-align:center; font-size:12px; }
    @media(max-width:920px) { .report-groups { grid-template-columns:repeat(2,minmax(0,1fr)); } .report-card:last-child { grid-column:1/-1; } }
    @media(max-width:620px) { .shell { width:min(100% - 28px,480px); } .hero { padding:19px 0 78px; } .topbar { align-items:flex-start; } .portal-nav { gap:5px; flex-wrap:wrap; justify-content:flex-end; } .portal-nav a { padding:7px 8px; font-size:10px; } .brand { font-size:12px; } .brand-mark { width:36px; height:36px; } .hero-copy { padding-top:40px; } .hero-copy p:last-child { font-size:14px; } main { padding-top:30px; } .report-groups { grid-template-columns:1fr; } .report-card:last-child { grid-column:auto; } }
</style>
